name: Android APK

# Builds an installable release APK (signed with the Expo template's debug
# keystore, which is fine for sideloading a hackathon demo, NOT for the Play
# Store) without needing an Expo/EAS account.
# Download it from the run page → Artifacts → "hoshiyar-shield-apk".

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Unit tests before building
        run: npm run test:ci
      - name: Generate native Android project (Continuous Native Generation)
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build release APK (arm64-v8a + armeabi-v7a)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Rename APK
        run: |
          mkdir -p ../../apk
          cp android/app/build/outputs/apk/release/app-release.apk ../../apk/hoshiyar-shield-${GITHUB_SHA::7}.apk
          ls -la ../../apk
      - uses: actions/upload-artifact@v4
        with:
          name: hoshiyar-shield-apk
          path: apk/*.apk
          retention-days: 30
